services:
  - type: web
    name: aquaheat-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: LLM_PROVIDER
        value: auto
      - key: USE_LIVE_DATA
        value: "0"
      - key: AWS_REGION
        value: us-east-1
      - key: GROQ_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AGENTCORE_RUNTIME_ARN
        sync: false
      - key: SAGEMAKER_ENDPOINT
        sync: false
